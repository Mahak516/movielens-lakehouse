name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (Spark transforms and data-quality checks)
        run: pytest -q

      - name: End-to-end smoke test on synthetic data
        run: |
          python scripts/make_sample_data.py --out data/sample
          PYTHONPATH=src python -m movielens_pipeline.run_pipeline \
            --input-dir data/sample --output-dir output --format parquet

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: output/quality_report.json
